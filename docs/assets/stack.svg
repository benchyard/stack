<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-label="From a task to a reviewed result."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#87e4c8"/></marker></defs><rect width="1200" height="730" rx="22" fill="#0d171d"/><g font-family="system-ui, sans-serif"><text x="48" y="64" fill="#87e4c8" font-size="13" letter-spacing="3">BENCHYARD / COMPOSABLE TOOLS</text><text x="48" y="118" fill="#e9f2f5" font-size="37" font-weight="650">From a task to a reviewed result.</text><text x="48" y="154" fill="#a4bec9" font-size="17">Choose the components you need. Keep task control, environments and evidence explicit.</text><rect x="48" y="200" width="320" height="150" rx="12" fill="#14252e" stroke="#35535e"/><rect x="48" y="218" width="4" height="28" fill="#87e4c8"/><text x="72" y="240" fill="#87e4c8" font-size="23" font-weight="600">Benchyard</text><text x="72" y="272" fill="#a4bec9" font-size="16">Shared tasks and reviews</text><text x="72" y="297" fill="#a4bec9" font-size="16">People + agent execution</text><text x="72" y="322" fill="#a4bec9" font-size="16">Official Worker: separate license</text><rect x="440" y="200" width="320" height="150" rx="12" fill="#14252e" stroke="#35535e"/><rect x="440" y="218" width="4" height="28" fill="#87e4c8"/><text x="464" y="240" fill="#87e4c8" font-size="23" font-weight="600">Acahti</text><text x="464" y="272" fill="#a4bec9" font-size="16">Git, PRs and pipeline checks</text><text x="464" y="297" fill="#a4bec9" font-size="16">Package identity + one MCP</text><text x="464" y="322" fill="#a4bec9" font-size="16">Or keep your existing Git host</text><rect x="832" y="200" width="320" height="150" rx="12" fill="#14252e" stroke="#35535e"/><rect x="832" y="218" width="4" height="28" fill="#87e4c8"/><text x="856" y="240" fill="#87e4c8" font-size="23" font-weight="600">Argos</text><text x="856" y="272" fill="#a4bec9" font-size="16">Once / soak acceptance checks</text><text x="856" y="297" fill="#a4bec9" font-size="16">Expected and actual evidence</text><text x="856" y="322" fill="#a4bec9" font-size="16">Optional shared dashboard</text><path d="M372 275 L435 275" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765 275 L827 275" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="245" y="425" width="710" height="150" rx="12" fill="#14252e" stroke="#35535e"/><rect x="245" y="443" width="4" height="28" fill="#a9c8ff"/><text x="269" y="465" fill="#a9c8ff" font-size="23" font-weight="600">Skheri</text><text x="269" y="497" fill="#a4bec9" font-size="16">Persistent task workspace → dev server → live preview</text><text x="269" y="522" fill="#a4bec9" font-size="16">Separate application release → tested image digest</text><text x="269" y="547" fill="#a4bec9" font-size="16">Standard Kubernetes and Helm; no required Git provider</text><path d="M208 355 L245 470" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 6"/><path d="M600 355 L600 420" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M955 470 L991 355" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="48" y="645" fill="#a4bec9" font-size="16">Dashed connection: automatic Benchyard–Skheri workspace binding is planned.</text><text x="48" y="680" fill="#87e4c8" font-size="16">Working reference: Skheri preview + Argos checks. No model API key required.</text></g></svg>